[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "giandoria"
version = "0.1.0"
description = "Offline foundations for the Giandoria Azure and Microsoft Fabric demo"
requires-python = ">=3.13,<3.14"
dependencies = ["tzdata==2026.5"]

[project.optional-dependencies]
fabric = ["fabric-cicd==1.4.0"]
runtime = ["azure-identity==1.26.0", "azure-eventhub==5.15.1", "requests==2.34.2", "websocket-client==1.9.0"]
ontology = ["deltalake==1.6.6", "pyarrow==26.0.0"]

[project.scripts]
giandoria = "giandoria.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
