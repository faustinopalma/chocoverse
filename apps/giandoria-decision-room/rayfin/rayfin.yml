id: giandoria-decision-room
name: Giandoria Decision Room
version: 1.0.0
services:
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://flat-cedar-bae98bff49-swedencentral.webapp.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
connectors:
  - name: enterprise
    type: fabric-semanticmodel
    config:
      workspaceId: ${GIANDORIA_MODEL_WORKSPACE_ID}
      itemId: ${GIANDORIA_MODEL_ID}
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
